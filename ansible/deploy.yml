---
- name: Deploy Docker application
  hosts: app_servers
  become: true

  vars:
    docker_image: "avah777/jenkins-docker-ansible"
    container_name: "jenkins-docker-ansible"
    container_port: "8080"
    host_port: "8080"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  tasks:

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: true
  
    - name: Install Python pip
      apt:
        name: python3-pip
        state: present
        update_cache: true

    - name: Upgrade Docker Python SDK
      ansible.builtin.pip:
        name: "docker>=7.1.0"
        state: present
        extra_args: --break-system-packages

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Pull application image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Stop existing application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Start application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Wait for application
      wait_for:
        host: 127.0.0.1
        port: "{{ host_port }}"
        delay: 5
        timeout: 60

    - name: Display running containers
      command: docker ps
      register: docker_ps
      changed_when: false

    - name: Show Docker containers
      debug:
        var: docker_ps.stdout
