---
- name: Deploy Docker application
  hosts: app_servers
  become: true

  vars:
    docker_image: "avah777/jenkins-docker-ansible"
    container_name: "jenkins-docker-ansible"
    container_port: "8080"
    host_port: "8080"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  tasks:

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Pull application image
      command:
        cmd: "docker pull {{ docker_image }}:{{ image_tag }}"

    - name: Stop existing application container
      command:
        cmd: "docker stop {{ container_name }}"
      register: stop_container
      failed_when: false
      changed_when: stop_container.rc == 0

    - name: Remove existing application container
      command:
        cmd: "docker rm {{ container_name }}"
      register: remove_container
      failed_when: false
      changed_when: remove_container.rc == 0

    - name: Start application container
      command:
        cmd: >
          docker run -d
          --name {{ container_name }}
          --restart unless-stopped
          -p {{ host_port }}:{{ container_port }}
          {{ docker_image }}:{{ image_tag }}

    - name: Wait for application
      wait_for:
        host: 127.0.0.1
        port: "{{ host_port }}"
        delay: 5
        timeout: 60

    - name: Check running containers
      command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Show running containers
      debug:
        var: docker_ps.stdout
